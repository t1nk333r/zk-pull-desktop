name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # attach the installer to the release on tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(uv run python -c 'import zk_pull_desktop; print(zk_pull_desktop.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.value }}"

      - name: Build app
        run: uv run pyinstaller --noconfirm --windowed --name "ZK Pull" --icon packaging/icon.ico --add-data "src/zk_pull_desktop/assets:zk_pull_desktop/assets" packaging/zk_pull.py

      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.value }} packaging\installer.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\ZK Pull" -DestinationPath "dist\ZK-Pull-Portable-${{ steps.version.outputs.value }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zk-pull-${{ steps.version.outputs.value }}
          path: |
            dist/ZK-Pull-Setup-*.exe
            dist/ZK-Pull-Portable-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZK-Pull-Setup-*.exe
            dist/ZK-Pull-Portable-*.zip
