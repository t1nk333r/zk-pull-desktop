name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only unless a job says otherwise: only the release job can write, and it runs no third-party code.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025  # a fixed image: windows-latest moves, and with it the Inno Setup version
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # Actions are pinned to commits; the comment is the release they were taken from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(uv run python -c 'import zk_pull_desktop; print(zk_pull_desktop.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION"

      - name: Build app
        run: uv run pyinstaller --noconfirm --windowed --name "ZK Pull" --icon packaging/icon.ico --add-data "src/zk_pull_desktop/assets:zk_pull_desktop/assets" packaging/zk_pull.py

      - name: Leave out unused Qt parts
        # PyInstaller collects Qt's networking, TLS (with a second OpenSSL), SVG, software OpenGL and
        # image plugins the app never uses; each would add a third-party licence to ship. Python's own
        # OpenSSL (libssl-3.dll, libcrypto-3.dll) stays: the updater needs it.
        shell: pwsh
        run: |
          $internal = "dist\ZK Pull\_internal"
          $qt = "$internal\PySide6"
          $unused = @(
            "$internal\libssl-3-x64.dll", "$internal\libcrypto-3-x64.dll",
            "$qt\QtNetwork.pyd", "$qt\Qt6Network.dll", "$qt\Qt6Svg.dll", "$qt\opengl32sw.dll",
            "$qt\plugins\tls", "$qt\plugins\networkinformation", "$qt\plugins\iconengines",
            "$qt\plugins\imageformats\qjpeg.dll", "$qt\plugins\imageformats\qtiff.dll",
            "$qt\plugins\imageformats\qwebp.dll", "$qt\plugins\imageformats\qsvg.dll",
            "$qt\plugins\imageformats\qicns.dll", "$qt\plugins\imageformats\qtga.dll",
            "$qt\plugins\imageformats\qwbmp.dll"
          )
          foreach ($path in $unused) {
            if (Test-Path $path) { Remove-Item -Recurse -Force $path } else { Write-Host "not built: $path" }
          }

      - name: Smoke test the built app
        # Starts the real exe offscreen with a temporary data folder; a missing file fails the build.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ZK Pull\ZK Pull.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the app did not quit (an error dialog?)" }
          if ($p.ExitCode -ne 0) { throw "the app exited with $($p.ExitCode)" }

      - name: Licences next to the app
        # LICENSE, the notices for bundled components and their licence texts; the installer and
        # the portable zip both take the whole folder.
        shell: pwsh
        run: |
          Copy-Item LICENSE "dist\ZK Pull\LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "dist\ZK Pull\"
          Copy-Item -Recurse packaging\licenses "dist\ZK Pull\licenses"

      - name: Build installer
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: iscc "/DAppVersion=$env:VERSION" packaging\installer.iss

      - name: Portable zip
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: Compress-Archive -Path "dist\ZK Pull" -DestinationPath "dist\ZK-Pull-Portable-$env:VERSION.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zk-pull-${{ steps.version.outputs.value }}
          path: |
            dist/ZK-Pull-Setup-*.exe
            dist/ZK-Pull-Portable-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    # Settings > Environments > release: add yourself as a required reviewer so a pushed tag waits
    # for approval before anything is published.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: zk-pull-${{ needs.windows.outputs.version }}
          path: dist

      - name: Release notes from CHANGELOG.md
        # The "## <version>" section, up to the next "## "; a release without notes is refused.
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v} " 'index($0, heading) == 1 {found=1; next} /^## / {found=0} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Never replaces the files of an existing release: installed copies trust what they download.
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ZK Pull ${GITHUB_REF_NAME#v}" --notes-file notes.md
