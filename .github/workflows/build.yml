name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only unless a job says otherwise: only the release job can write, and it runs no third-party code.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # Actions are pinned to commits; the comment is the release they were taken from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.13.7"

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Version
        id: version
        shell: bash
        run: echo "value=$(uv run python -c 'import zk_pull_desktop; print(zk_pull_desktop.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.version.outputs.value }}"

      - name: Build app
        run: uv run pyinstaller --noconfirm --windowed --name "ZK Pull" --icon packaging/icon.ico --add-data "src/zk_pull_desktop/assets:zk_pull_desktop/assets" packaging/zk_pull.py

      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.value }} packaging\installer.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\ZK Pull" -DestinationPath "dist\ZK-Pull-Portable-${{ steps.version.outputs.value }}.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zk-pull-${{ steps.version.outputs.value }}
          path: |
            dist/ZK-Pull-Setup-*.exe
            dist/ZK-Pull-Portable-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: zk-pull-${{ needs.windows.outputs.version }}
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "ZK Pull ${GITHUB_REF_NAME#v}" --generate-notes
          fi
